# How to build Arch.
#
# There is no `.xcodeproj` in this repository, and that is deliberate: a
# `project.pbxproj` is a generated file that merges badly, records absolute paths,
# and changes whenever anybody opens Xcode. This spec is the source of truth and
# the project is generated from it —
#
#     brew install xcodegen && xcodegen generate && open Arch.xcodeproj
#
# **The point of this file is that the Swift can finally be compiled.** Sixteen
# thousand lines were written on a Windows machine with no Swift toolchain, checked
# only by `tools/swiftcheck.py`, which proves names resolve and nothing else. CI
# builds this on a free macOS runner: no Mac, no paid developer account, no signing
# — building for the simulator needs none of them.

name: Arch

options:
  # `@Observable`, the two-parameter `onChange(of:)`, and `PhotosPicker`'s
  # `.ordered` selection are all iOS 17. Nothing in the app carries an
  # `@available` fallback, so this is a floor rather than a preference.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Warnings are the only feedback this project has ever had. Treating them as
    # errors on a first build would bury the real ones, so they stay warnings and
    # get read.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Arch:
    type: application
    platform: iOS

    sources:
      - path: Arch

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arch.arch
        PRODUCT_NAME: Arch
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # Nothing here is signed. The simulator does not ask, and the whole reason
        # this builds without a developer account is that it never tries.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only, as the design has always been.

    info:
      path: Arch/Info.plist
      properties:
        CFBundleDisplayName: Arch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait only. Arch is a reading app held in one hand, and no screen in
        # it was drawn for landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dark and light both exist and both are drawn; the reader's own choice is
        # applied at the root, so the system is never left to pick.
        UIUserInterfaceStyle: Automatic

        # **Empty on purpose.** `ArchConfig.isConfigured` is false without both,
        # and the app then runs as the design build on MockData — which is exactly
        # what CI should build, since CI has no business holding project keys.
        # Fill these in locally, or in a build setting, to point a build at
        # Supabase.
        ARCH_SUPABASE_URL: ""
        ARCH_SUPABASE_ANON_KEY: ""

        # The fonts are registered at runtime by `ArchTypography`, not listed here
        # — see the note there. They still have to be in the bundle, which the
        # `sources` entry above takes care of.

schemes:
  Arch:
    build:
      targets:
        Arch: all
    run:
      config: Debug
    archive:
      config: Release
