# How to build Arch.
#
# There is no `.xcodeproj` in this repository, and that is deliberate: a
# `project.pbxproj` is a generated file that merges badly, records absolute paths,
# and changes whenever anybody opens Xcode. This spec is the source of truth and
# the project is generated from it —
#
#     brew install xcodegen && xcodegen generate && open Arch.xcodeproj
#
# **The point of this file is that the Swift can finally be compiled.** Sixteen
# thousand lines were written on a Windows machine with no Swift toolchain, checked
# only by `tools/swiftcheck.py`, which proves names resolve and nothing else. CI
# builds this on a free macOS runner: no Mac, no paid developer account, no signing
# — building for the simulator needs none of them.

name: Arch

options:
  # `@Observable`, the two-parameter `onChange(of:)`, and `PhotosPicker`'s
  # `.ordered` selection are all iOS 17. Nothing in the app carries an
  # `@available` fallback, so this is a floor rather than a preference.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Warnings are the only feedback this project has ever had. Treating them as
    # errors on a first build would bury the real ones, so they stay warnings and
    # get read.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Arch:
    type: application
    platform: iOS

    sources:
      - path: Arch

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arch.arch
        PRODUCT_NAME: Arch
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only, as the design has always been.

        # Empty by default, which makes every build that does not say otherwise the
        # design build on `MockData`. `Info.plist` reads these through `$(...)`, so
        # a configuration can fill them in without a code change.
        ARCH_SUPABASE_URL: ""
        ARCH_SUPABASE_ANON_KEY: ""

      configs:
        # **Debug is deliberately still the design build.** CI builds and tests
        # Debug, and all seven UI tests depend on `ArchConfig.isConfigured` being
        # false: with real keys the app would open on the signed-out screen instead
        # of the roster and every one of them would fail. Nothing is signed here
        # either -- the simulator does not ask, and never trying is the whole reason
        # this builds without a developer account.
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGN_IDENTITY: ""

        # Release is the real app: signed, and pointed at Supabase.
        #
        # **The anon key is not a secret.** It identifies the project and nothing
        # more; every row it can reach is decided by row-level security on the
        # server. It is designed to ship inside clients, so it is in this file
        # rather than in a build secret. The key that *is* secret is the service
        # key, which bypasses RLS and must never appear in this target.
        #
        # The legacy JWT rather than the newer `sb_publishable_` key, because
        # `SupabaseClient` sends it in the `Authorization: Bearer` position as well
        # as `apikey`, and that position expects a JWT.
        Release:
          CODE_SIGN_STYLE: Automatic
          ARCH_SUPABASE_URL: https://bxuzpbzidrmoeietjnem.supabase.co
          ARCH_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4dXpwYnppZHJtb2VpZXRqbmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNjkyODUsImV4cCI6MjEwNDg0NTI4NX0.zf8e9gAyZiJJxkpU2qtsD0Qk3_IYvD_Xq_13E1HlkaE"

    info:
      path: Arch/Info.plist
      properties:
        CFBundleDisplayName: Arch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait only. Arch is a reading app held in one hand, and no screen in
        # it was drawn for landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dark and light both exist and both are drawn; the reader's own choice is
        # applied at the root, so the system is never left to pick.
        UIUserInterfaceStyle: Automatic

        # Read from the build settings above rather than written here, so that
        # Debug stays the design build and Release is the real one. Xcode expands
        # `$(...)` in Info.plist values when it processes the file.
        ARCH_SUPABASE_URL: "$(ARCH_SUPABASE_URL)"
        ARCH_SUPABASE_ANON_KEY: "$(ARCH_SUPABASE_ANON_KEY)"

        # The fonts are registered at runtime by `ArchTypography`, not listed here
        # — see the note there. They still have to be in the bundle, which the
        # `sources` entry above takes care of.

  # Tapping the app, as opposed to starting it.
  #
  # `tools/simrun.py` answers "does it launch and draw". This answers "does it do
  # anything when you touch it", which is a different question and the one that
  # covers dead buttons, crashes on opening a profile, and navigation routes that
  # push nothing -- the last of which is a mistake this project has actually made.
  ArchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ArchUITests
    dependencies:
      - target: Arch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arch.arch.uitests
        TEST_TARGET_NAME: Arch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  Arch:
    build:
      targets:
        Arch: all
        ArchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchUITests
    archive:
      config: Release
