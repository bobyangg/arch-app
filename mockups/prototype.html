<title>Arch Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* The Arch palette, verbatim. */
  --night:#0F1319; --stone:#171C24; --stoneRaised:#212832;
  --limestone:#EDE7DD; --mortar:#8D949E; --lamp:#F0A44B; --verdigris:#4E8C7D;
  --hairline:rgba(141,148,158,.12);
  --quiet:rgba(141,148,158,.20);
  --lampQuiet:rgba(240,164,75,.45);
  --selected:rgba(237,231,221,.30);
  --surround:#05070A;

  /* New York on Apple devices; Source Serif 4 everywhere else. */
  --serif: ui-serif, "New York", "Source Serif 4", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;

  --r-photo:24px; --r-card:20px; --r-control:12px; --r-sheet:28px; --r-detail:8px;
  --s-xxs:4px; --s-xs:8px; --s-s:12px; --s-m:16px; --s-l:20px;
  --s-xl:24px; --s-xxl:32px; --s-xxxl:48px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--surround); color:var(--limestone); font-family:var(--sans);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left;}
:focus-visible{outline:2px solid var(--lamp); outline-offset:2px;}

/* ---- the device ---- */
#device{
  width:393px; height:852px; max-width:100vw; max-height:100dvh;
  background:var(--night); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
}
@media (min-width:460px) and (min-height:900px){
  #device{border-radius:44px; box-shadow:0 0 0 10px #14181f, 0 30px 80px rgba(0,0,0,.7);}
}
@media (max-width:459px), (max-height:899px){
  #device{width:100vw; height:100dvh;}
}

/* ---- type scale ---- */
.display{font-family:var(--serif); font-size:40px; line-height:46px; font-weight:500; letter-spacing:.5px;}
.titleL{font-family:var(--serif); font-size:30px; line-height:36px; font-weight:600;}
.titleM{font-family:var(--serif); font-size:24px; line-height:30px; font-weight:600;}
.prompt{font-family:var(--serif); font-size:19px; line-height:26px; font-weight:400;}
.bodyL{font-size:20px; line-height:28px;}
.body{font-size:17px; line-height:24px;}
.callout{font-size:16px; line-height:22px;}
.subhead{font-size:15px; line-height:20px; font-weight:600;}
.footnote{font-size:13px; line-height:18px;}
.caption{font-size:12px; line-height:16px; font-weight:500;}
.mortar{color:var(--mortar);}
.limestone{color:var(--limestone);}

/* ---- scroll region ---- */
.screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
.pad{padding-left:var(--s-l); padding-right:var(--s-l);}
.safetop{height:env(safe-area-inset-top,0px);}
.hairline{height:.5px; background:var(--hairline);}

/* ---- chrome ---- */
.navbar{display:flex; align-items:center; gap:var(--s-s); padding:8px 20px 8px 8px; flex:none;}
.iconbtn{width:44px; height:44px; display:flex; align-items:center; justify-content:center;
         font-size:17px; color:var(--limestone); flex:none;}
.iconbtn.round{width:36px; height:36px; border-radius:18px; background:var(--stone);}

.tabbar{flex:none; background:var(--stoneRaised); border-top:.5px solid var(--hairline);
        display:flex; padding:8px 0 calc(4px + env(safe-area-inset-bottom,0px));}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0;}
.tab .lbl{font-size:12px; line-height:16px; font-weight:500; color:var(--mortar);}
.tab[aria-selected="true"] .lbl{color:var(--lamp);}
.glyph{width:26px; height:26px; position:relative;}
.badge{position:absolute; top:-5px; right:-9px; min-width:16px; height:16px; border-radius:8px;
       background:var(--lamp); color:var(--night); font-size:11px; font-weight:600;
       display:flex; align-items:center; justify-content:center; padding:0 4px;}

/* ---- pieces ---- */
.photo{border-radius:var(--r-photo); width:100%;}
.chips{display:flex; flex-wrap:wrap; gap:var(--s-xs);}
.chip{background:var(--stone); border-radius:var(--r-control); padding:8px 12px;
      font-size:12px; line-height:16px; font-weight:500; color:var(--mortar);}
.interest{background:var(--stone); border-radius:var(--r-control); padding:8px 12px;
          font-size:13px; line-height:18px; color:var(--limestone);}
.interest.add{background:none; border:1px solid var(--quiet); color:var(--mortar);}

.card{background:var(--stone); border-radius:var(--r-card); padding:var(--s-xl); position:relative;}
.card.sel{box-shadow:inset 0 0 0 1px var(--lampQuiet);}
.photo.sel{box-shadow:inset 0 0 0 1px var(--lampQuiet);}

.btn{height:52px; border-radius:var(--r-control); display:flex; align-items:center;
     justify-content:center; font-size:15px; font-weight:600; width:100%;}
.btn.primary{background:var(--lamp); color:var(--night);}
.btn.primary[disabled]{background:var(--stoneRaised); color:var(--mortar); cursor:default;}
.btn.quiet{border:1px solid var(--quiet); color:var(--mortar);}
.btntext{height:44px; display:flex; align-items:center; justify-content:center;
         font-size:15px; font-weight:600; color:var(--mortar); width:100%;}

.slotcard{height:112px; background:var(--stone); border:1px solid var(--hairline);
          border-radius:var(--r-photo); display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:4px;}

.bottombar{flex:none; background:var(--stoneRaised); border-top:.5px solid var(--hairline);
           padding:12px 20px calc(4px + env(safe-area-inset-bottom,0px));}

/* ---- rows ---- */
.row{display:flex; gap:var(--s-s); padding:var(--s-m) 0; align-items:flex-start;}
.avatar{width:52px; height:52px; border-radius:26px; flex:none;}
.rowbody{flex:1; min-width:0;}
.rowline{display:flex; align-items:baseline; gap:var(--s-xs);}
.dot{width:8px; height:8px; border-radius:4px; background:var(--lamp); margin-top:5px; flex:none;}
.rowrule{height:.5px; background:var(--hairline); margin-left:64px;}

/* ---- bubbles ---- */
.bubble{border-radius:var(--r-card); padding:10px 14px; font-size:16px; line-height:22px;
        max-width:80%; display:inline-block;}
.bubble.out{background:var(--stoneRaised);}
.bubble.in{background:var(--stone);}
.msg{display:flex; flex-direction:column; gap:4px; margin-bottom:var(--s-s);}
.msg.out{align-items:flex-end;}
.quoted{background:var(--stoneRaised); border-radius:var(--r-control); padding:var(--s-s);}

/* ---- sheets ---- */
#scrim{position:absolute; inset:0; background:rgba(15,19,25,.72); opacity:0;
       transition:opacity .25s ease; pointer-events:none; z-index:20;}
#scrim.on{opacity:1; pointer-events:auto;}
#sheet{position:absolute; left:0; right:0; bottom:0; background:var(--stone);
       border-radius:var(--r-sheet) var(--r-sheet) 0 0; z-index:21;
       padding:0 20px calc(16px + env(safe-area-inset-bottom,0px));
       transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
       max-height:88%; overflow-y:auto;}
#sheet.on{transform:translateY(0);}
.grabber{width:36px; height:5px; border-radius:3px; background:var(--mortar);
         opacity:.4; margin:8px auto 12px;}

/* ---- inputs ---- */
.field{background:var(--night); border-radius:var(--r-control); padding:12px;
       display:flex; align-items:center; gap:var(--s-s);}
.field.onNight{background:var(--stone);}
.field input, .field textarea{
  flex:1; background:none; border:0; color:var(--limestone);
  font-family:var(--sans); font-size:16px; line-height:22px; outline:none; resize:none;}
.field input::placeholder, .field textarea::placeholder{color:var(--mortar);}
.field .lbl{font-size:13px; color:var(--mortar); width:108px; flex:none;}

/* ---- settings ---- */
.group{background:var(--stone); border-radius:var(--r-card); overflow:hidden;}
.srow{display:flex; align-items:center; gap:var(--s-s); padding:var(--s-m);}
.srow .t{font-size:17px; line-height:24px; flex:1;}
.srule{height:.5px; background:var(--hairline); margin-left:var(--s-m);}

/* ---- settings controls ---- */
.switch{width:51px; height:31px; border-radius:16px; background:var(--stoneRaised);
        position:relative; flex:none; transition:background .2s ease;}
.switch.on{background:var(--lamp);}
.switch .knob{position:absolute; top:2px; left:2px; width:27px; height:27px;
              border-radius:14px; background:var(--limestone); transition:transform .2s ease;}
.switch.on .knob{transform:translateX(20px);}
.slider{width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
        background:var(--stone); outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px;
        border-radius:13px; background:var(--lamp); cursor:pointer;}
.slider::-moz-range-thumb{width:26px; height:26px; border:0; border-radius:13px;
        background:var(--lamp); cursor:pointer;}
.rangetrack{position:relative; height:44px; touch-action:none;}
.rangetrack::before{content:""; position:absolute; left:13px; right:13px; top:20px;
        height:4px; border-radius:2px; background:var(--stone);}
.rangefill{position:absolute; top:20px; height:4px; border-radius:2px; background:var(--lamp);}
.knobR{position:absolute; top:9px; width:26px; height:26px; border-radius:13px;
       background:var(--lamp); touch-action:none;}

/* ---- onboarding ---- 
.rule{display:flex; gap:4px;}
.seg{flex:1; height:2px; border-radius:1px; background:rgba(141,148,158,.25);
     transition:background .25s ease;}
.seg.on{background:var(--lamp);}
.opt{background:var(--stone); border-radius:var(--r-control); padding:var(--s-m);
     font-size:17px; line-height:24px;}
.opt.sel{background:var(--stoneRaised); box-shadow:inset 0 0 0 1px var(--selected);}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-xs);}
.slot{aspect-ratio:1; border-radius:var(--r-control); position:relative;}
.slot.add{background:var(--stone); display:flex; align-items:center; justify-content:center;
          color:var(--mortar); font-size:20px;}
.slot .x{position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:12px;
         background:rgba(15,19,25,.75); display:flex; align-items:center;
         justify-content:center; font-size:12px;}

/* ---- motion ---- */
.leaving{overflow:hidden;}
.stone-drop{transition:transform .3s ease-in, opacity .3s ease-in;
            transform:translateY(14px); opacity:0;}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important; animation-duration:.01ms !important;}
}

/* stacking helpers */
.v{display:flex; flex-direction:column;}
.gap-xxs{gap:4px;} .gap-xs{gap:8px;} .gap-s{gap:12px;} .gap-m{gap:16px;}
.gap-l{gap:20px;} .gap-xl{gap:24px;} .gap-xxl{gap:32px;}
.mt-s{margin-top:12px;} .mt-m{margin-top:16px;} .mt-l{margin-top:20px;}
.mt-xl{margin-top:24px;} .mt-xxl{margin-top:32px;} .mt-xxxl{margin-top:48px;}
.pb-xxxl{padding-bottom:48px;}
.center{text-align:center;}
.spread{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
</style>

<div id="device">
  <div id="root" class="v" style="flex:1; min-height:0;"></div>
  <div id="scrim"></div>
  <div id="sheet"></div>
</div>

<script>
/* ============================ data ============================ */
const TONES=[["#29313C","#232A34"],["#3B322A","#332B24"],["#2B3733","#25302C"],
             ["#333941","#2C3138"],["#443329","#3B2C23"],["#4A4640","#413E38"]];
const tone=i=>`background:linear-gradient(${TONES[i%6][0]},${TONES[i%6][1]})`;

const P=(id,name,age,hood,city,h,work,photos,prompts,interests)=>
  ({id,name,age,hood,city,h,work,photos,prompts,interests});

const PEOPLE=[
 P("nadia","Nadia",29,"Gowanus","Brooklyn","5 ft 7","Structural engineer",[0,3,1,5],
   [["The last thing I read twice","A field guide to bridges I found in my grandad's garage. Half of it is tables of load limits and I still went back to the beginning."],
    ["Where I go when I need to think","The walkway on the Manhattan Bridge, heading the unpopular direction so nobody is walking at me."],
    ["Something I am slower at than everyone else","Ordering. I will read the entire menu twice and then get whatever you got."]],
   ["Bridge inspections","Long-distance walking","Brutalist car parks"]),
 P("teo","Teo",33,"Ridgewood","Queens","6 ft","Pastry cook",[4,2,0,3],
   [["A thing I have changed my mind about","That working nights was temporary. It has been four years and I have stopped apologising for being awake at three."],
    ["The best argument I have lost","My sister spent an entire drive to Hudson convincing me that sourdough is mostly theatre. She is right. I have kept doing it anyway."],
    ["Where I go when I need to think","The all-night laundromat on Fresh Pond. Warm, and loud in a way that is not people talking to you."]],
   ["Night baking","Laundromats","Dulce de leche"]),
 P("priya","Priya",27,"Crown Heights","Brooklyn","5 ft 4","Restores film cameras",[2,5,1,4],
   [["Something I am slower at than everyone else","Replying. It is not avoidance. I write the message, put the phone down, and find it three days later still sitting there."],
    ["The last thing I read twice","The service manual for a Rolleiflex, in German, which I do not read. The exploded diagrams are enough."],
    ["A thing I have changed my mind about","Digital. I was insufferable about it for about six years. Now I mostly want the picture."]],
   ["Rolleiflex repair","Darkroom printing","German manuals"]),
 P("marcus","Marcus",31,"Bed-Stuy","Brooklyn","5 ft 11","Nurse, emergency",[1,4,3,0],
   [["Where I go when I need to think","Prospect Park at eight in the morning after a shift, when it is only dog people and me, all of us quiet."],
    ["A thing I have changed my mind about","That I would get used to it. You do not. You get better at leaving it at the door, which is a different skill."],
    ["The best argument I have lost","A patient's grandmother explained that I was holding a mop wrong. She had cleaned offices for forty years. I hold it her way now."]],
   ["Dawn in Prospect Park","Mop technique","Sleeping through noise"]),
 P("ines","Ines",32,"Sunset Park","Brooklyn","5 ft 5","Bookbinder",[1,4,0,2],
   [["The last thing I made with my hands","A slipcase for a book that did not deserve one. Nine hours, and I would do it again."],
    ["Something I do that takes far too long","Choosing paper. I have stood in the same aisle for forty minutes and left with nothing."],
    ["A thing I am probably wrong about","That anything worth keeping should be physical. I say it constantly and my phone is always in my hand."]],
   ["Japanese paper","Cloth spines","Repairs that take months"]),
 P("dev","Dev",29,"Astoria","Queens","6 ft 1","Bus mechanic",[3,5,2,1],
   [["What I would happily explain for an hour","Why the articulated buses bend where they do, and why almost everyone guesses it wrong."],
    ["Where I go when I need to think","The depot at four in the morning, before anyone is in. Sixty buses and no noise at all."],
    ["A risk that worked out","Turning down the desk job my parents wanted for me. It took about six years to stop being an argument."]],
   ["Articulated buses","Four in the morning","Engine noise"]),
 P("yusuf","Yusuf",34,"Harlem","Manhattan","5 ft 8","Piano tuner",[5,1,3,0],
   [["Something I notice that other people do not","Which rooms are in tune with themselves. Some rooms make everything sound slightly sour and nobody can say why."],
    ["A detail I get unreasonably interested in","The felt on a hammer. You can read someone\u2019s whole playing history off eighty-eight pieces of felt."],
    ["What I miss about where I grew up","Being able to hear the sea from a room with no window facing it."]],
   ["Hammer felt","Rooms with good sound","Walking at night"]),
 P("lena","Lena",30,"Bushwick","Brooklyn","5 ft 9","Translator",[5,0,2,1],
   [["Something I am slower at than everyone else","Jokes in English. I get there, about four seconds after the table has moved on to something else."],
    ["The last thing I read twice","A translation of a poem I already knew in Portuguese, to see what the translator gave up. Quite a lot, it turns out."],
    ["Where I go when I need to think","The Q platform at Kings Highway. It is above ground, so you can watch weather arrive from a long way off."]],
   ["Untranslatable tenses","Above-ground platforms","Portuguese poetry"])];

const YOU=P("you","Sam",30,"Fort Greene","Brooklyn","5 ft 10","Sound engineer",[3,1,4,0,2,5],
  [["Where I go when I need to think","The bench at the top of the hill in Fort Greene Park, early, before the tennis courts start up."],
   ["Something I am slower at than everyone else","Leaving. I will say goodbye at the door and still be there twenty minutes later, coat on."],
   ["The best argument I have lost","A drummer once explained why the click track was not the problem. It was me. It was me for about a year."]],
  ["Room tone","Click tracks","Fort Greene Park"]);

const byId=id=>PEOPLE.find(p=>p.id===id);
const isRequest=c=>c.state==="request";
const openConvos=()=>S.convos.filter(c=>!isRequest(c));
const requests=()=>S.convos.filter(isRequest);
const HANA=P("hana","Hana",28,"Greenpoint","Brooklyn","5 ft 6","Landscape architect",[2],
  [["A thing I have changed my mind about","Lawns. I spent a degree learning to hate them and now I just think about who has to mow it."]],
  ["Street trees","Drainage","Chairs outdoors"]);

const BENEFITS=[["Refill a slot today","Fill an open slot straight away instead of waiting for tomorrow."],
 ["A sixth slot","Hold six people at once instead of five."],
 ["Tips for your profile","Specific notes on your photos and answers, and what to change."],
 ["Six prompts instead of three","More room to be specific about yourself."],
 ["Finer preferences","Choose who reaches you on the things you actually care about, not only distance and age."]];
const PLANS=[["One month","$24.99","$24.99 a month",0],["Three months","$53.97","$17.99 a month",1],
 ["Twelve months","$143.88","$11.99 a month",0]];
const SETTINGS=[["Account",[["Phone number","+1 (917) 555 0142"],["Email","sam@example.com"],["Arch Premium","Not subscribed"]]],
 ["Notifications",[["Your daily five","9:00"],["New people","On"],["Messages","On"]]],
 ["Discovery",[["Distance","Within 10 miles"],["Age range","26 to 36"],["Looking for","Something serious"],["Pause my profile",null]]],
 ["Privacy",[["Who can see me",null],["Blocked people","None"],["Download your data",null]]],
 ["Help",[["How Arch works",null],["Safety",null],["Contact us",null]]]];
const QUESTIONS=[
 ["Someone cancels plans an hour before. What is your honest first reaction?",
  ["Relief","Irritation","Neither, genuinely"]],
 ["What does a good Saturday look like?",
  ["Nothing in the diary","One good thing","Booked from the morning"]],
 ["How do you get your energy back?",
  ["On my own and quiet","With one or two people","In a room full of people"]],
 ["What are you like first thing in the morning?",
  ["Up early and useful","Slow but fine","Do not talk to me"]],
 ["How much of your week is planned in advance?",
  ["Most of it","Some of it","Almost none of it"]],
 ["When something is bothering you, do you want to talk it through or sit with it first?",
  ["Talk it through","Sit with it first","Genuinely depends"]],
 ["How direct are you when something is wrong?",
  ["I say it straight away","I wait until I know what I think","I tend to let small things go"]],
 ["After an argument, what do you need?",
  ["To finish it before sleeping","Some time apart first","To know we are fine, details later"]],
 ["How much reassurance do you want from someone?",
  ["A lot, and I will say so","Some, at the right moments","Not much, I assume things are fine"]],
 ["Where does drinking sit in your life?",
  ["It is part of how I socialise","Occasionally","I do not drink"]],
 ["How close are you to your family?",
  ["Very, we talk constantly","Close, but not in each other\u2019s days","It is complicated","Not close"]],
 ["What is money for?",
  ["Spending on things worth doing","Building something steady","I try not to think about it much"]],
 ["How much does your work matter to you?",
  ["It is a large part of who I am","It pays for the rest of my life","Somewhere in between"]],
 ["Do you want children?",
  ["Yes","No","Open to it","Still working it out"]],
 ["Do you see yourself with one person at a time?",
  ["Yes, one at a time","No, that is not how I do relationships","Still working it out"]],
 ["Do you want to be living in this city in five years?",
  ["Yes","No","It depends who I am with"]]];

const PROMPT_LIBRARY=[
 ["How you spend your time",[
   "Where I go when I need to think",
   "Something I am slower at than everyone else",
   "The last thing I made with my hands",
   "What my week actually looks like",
   "A place in this city I keep going back to",
   "Something I do that takes far too long"]],
 ["What you think",[
   "A thing I have changed my mind about",
   "The best argument I have lost",
   "Something everyone likes that I do not",
   "A thing I am probably wrong about",
   "Something I will defend that I should not",
   "The last strong opinion I formed"]],
 ["What you notice",[
   "The last thing I read twice",
   "A detail I get unreasonably interested in",
   "The last thing that genuinely surprised me",
   "What I would happily explain for an hour",
   "Something I looked up recently and fell into",
   "Something I notice that other people do not"]],
 ["Where you are headed",[
   "Something I inherited that is not money",
   "What I miss about where I grew up",
   "A risk that worked out",
   "What I am slowly getting better at",
   "The best decision I made on impulse",
   "Something I want to be doing in five years"]]];

/* Questions already used by your other answers stay visible and inert rather than
   hidden — hiding them makes the library look shorter and leaves you hunting for
   one you already have. */
function promptPicker(currentText,taken){
  let h='<div class="v gap-xl">';
  PROMPT_LIBRARY.forEach(function(g){
    h+='<div class="v gap-xs"><div class="prompt mortar">'+g[0]+'</div><div class="v gap-xs">';
    g[1].forEach(function(q){
      const isCur=q===currentText, isTaken=taken.indexOf(q)>=0 && !isCur;
      h+='<button '+(isTaken?'':'data-a="pickQuestion" data-q="'+esc(q)+'"')
        +' style="display:block;width:100%">'
        +'<div class="opt '+(isCur?"sel":"")+'" style="display:flex; gap:12px; align-items:center'
        +(isTaken?'; color:var(--mortar)':'')+'">'
        +'<span style="flex:1">'+esc(q)+'</span>'
        +(isTaken?'<span class="footnote mortar">In use</span>'
                 :(isCur?'<span class="footnote">&#10003;</span>':''))
        +'</div></button>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}

/* ============================ state ============================ */
const S={
  tab:"daily",
  stacks:{premium:[],daily:[],messages:[],you:[]},
  /* Nobody here is somebody you have written to — writing is what takes them out
     of your five. Hana is the exception that shows the rule: she wrote first, so
     your slot is untouched. */
  slots:["priya","marcus","ines","dev"].map(id=>({person:PEOPLE.find(p=>p.id===id)}))
        .concat([{person:HANA}]),
  LIMIT:10, WARN:8,
  selected:null,

/* ============================ the arch ============================ */
function archSVG(filled,total,w,dropIndex){
  const joint=1.3, thick=18, allow=1, step=180/total;
  const H=w/2+allow, cx=w/2, cy=H, base=Math.min(w/2,H)-allow;
  const pt=(r,d)=>{const a=d*Math.PI/180; return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let paths="";
  for(let i=0;i<total;i++){
    const a0=180+i*step+joint, a1=180+(i+1)*step-joint;
    const o0=pt(base,a0),o1=pt(base,a1),i1=pt(base-thick,a1),i0=pt(base-thick,a0);
    const d=`M${o0} A${base},${base} 0 0 1 ${o1} L${i1} A${base-thick},${base-thick} 0 0 0 ${i0} Z`;
    const on=i<filled;
    const drop=(i===dropIndex)?' class="stone-drop"':'';
    paths+=on
      ? `<path${drop} d="${d}" fill="var(--lamp)"/>`
      : `<path d="${d}" fill="none" stroke="rgba(141,148,158,.30)" stroke-width="1"/>`;
  }
  return `<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" aria-hidden="true">${paths}</svg>`;
}
function markSVG(size,stroke,color){
  const W=size-stroke, r=.42*W, cx=W/2, cy=.59*W, foot=.90*W;
  const d=`M${cx-r},${foot} V${cy} A${r},${r} 0 0 1 ${cx+r},${cy} V${foot} M0,0 H${W}`;
  return `<svg width="${size}" height="${size*.9}" viewBox="0 0 ${size} ${size*.9}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-linejoin="round"
      transform="translate(${stroke/2},${stroke/2})"/></svg>`;
}

/* ============================ tab glyphs ============================ */
function glyph(kind,active){
  const c=active?"var(--lamp)":"var(--mortar)", sw=active?2.25:1.75;
  if(kind==="daily") return markSVG(26,sw,c);
  if(kind==="premium"){
    const w=20,h=24,ox=3,oy=1,i=sw/2,t=w*.16;
    return `<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path
      d="M${ox+i},${oy+i} L${ox+w-i},${oy+i} L${ox+w-t},${oy+h-i} L${ox+t},${oy+h-i} Z"
      fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/></svg>`;}
  if(kind==="messages"){
    const i=sw/2,w=24-sw,h=24-sw,ox=1+i,oy=1+i,bb=oy+h*.76,k=w*.22;
    return `<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="
      M${ox},${oy+k} Q${ox},${oy} ${ox+k},${oy} L${ox+w-k},${oy} Q${ox+w},${oy} ${ox+w},${oy+k}
      L${ox+w},${bb-k} Q${ox+w},${bb} ${ox+w-k},${bb} L${ox+w*.44},${bb}
      L${ox+w*.18},${oy+h} L${ox+w*.28},${bb} L${ox+k},${bb} Q${ox},${bb} ${ox},${bb-k} Z"
      fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
  const i=sw/2,w=24-sw,h=24-sw,ox=1+i,oy=1+i;
  const hr=w*.17,hcx=ox+w/2,hcy=oy+hr,sr=w*.46,scy=oy+h*.52+sr;
  const p=(d)=>{const a=d*Math.PI/180; return [hcx+sr*Math.cos(a),scy+sr*Math.sin(a)];};
  const A=p(190),B=p(350);
  return `<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
    <circle cx="${hcx}" cy="${hcy}" r="${hr}" fill="none" stroke="${c}" stroke-width="${sw}"/>
    <path d="M${A} A${sr},${sr} 0 0 1 ${B}" fill="none" stroke="${c}" stroke-width="${sw}"
      stroke-linecap="round"/></svg>`;
}

/* profile scroll order: photos and answers alternate, interests after photo 2 */
function rows(p){
  const out=[]; let i=0,j=0;
  while(i<p.photos.length||j<p.prompts.length){
    if(i<p.photos.length) out.push(["photo",i++]);
    if(j<p.prompts.length) out.push(["prompt",j++]);
  }
  let seen=0,at=out.length;
  for(let k=0;k<out.length;k++){ if(out[k][0]==="photo"){seen++; if(seen===2){at=k+1;break;}} }
  out.splice(at,0,["interests",0]);
  return out.slice(1); // the lead photo is drawn separately
}

    <div class="footnote" style="flex:1; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap">${esc(q[0])}</div></div>`;});
  return h+`</div></div></div>`;
}

function settingsSections(){
  const x=S.set;
  const notif=[["n-daily","Your daily five",null,"toggle"]];
  if(x.daily) notif.push(["n-time","Time",x.time,"push"]);
  notif.push(["n-new","New people",null,"toggle"],["n-msg","Messages",null,"toggle"]);
  return [
    ["Account",[["a-phone","Phone number",x.phone,"push"],["a-email","Email",x.email,"push"],
      ["a-premium","Arch Premium",x.sub?"Subscribed":"Not subscribed","push"]]],
    ["Notifications",notif],
    ["Discovery",[["d-distance","Distance","Within "+x.distance+" miles","push"],
      ["d-age","Age range",x.minAge+" to "+x.maxAge,"push"],
      ["d-intent","Looking for",x.intent,"push"],
      ["d-pause","Pause my profile",null,"toggle"]]],
    ["Privacy",[["p-visible","Who can see me",x.visibility,"push"],
      ["p-blocked","Blocked people",x.blocked.length?String(x.blocked.length):"None","push"],
      ["p-data","Download your data",null,"push"]]],
    ["Help",[["h-how","How Arch works",null,"push"],["h-safety","Safety",null,"push"],
      ["h-contact","Contact us",null,"push"]]]];
}
const TOGGLES={"n-daily":"daily","n-new":"newPeople","n-msg":"msgAlert","d-pause":"paused"};

function settings(){
  let h=navbar("Settings");
  h+='<div class="screen"><div class="pad pb-xxxl mt-l"><div class="v gap-xl">';
  settingsSections().forEach(function(sec){
    var title=sec[0], rws=sec[1];
    h+='<div class="v gap-xs"><div class="footnote mortar" style="padding-left:4px">'+title+'</div><div class="group">';
    rws.forEach(function(r,i){
      var id=r[0],t=r[1],d=r[2],kind=r[3];
      if(kind==="toggle"){
        var on=S.set[TOGGLES[id]];
        h+='<button data-a="toggleSetting" data-id="'+id+'" style="display:block;width:100%">'
          +'<div class="srow"><div class="t">'+esc(t)+'</div>'
          +'<div class="switch '+(on?"on":"")+'"><div class="knob"></div></div></div></button>';
      } else {
        h+='<button data-a="setting" data-id="'+id+'" style="display:block;width:100%">'
          +'<div class="srow"><div class="t">'+esc(t)+'</div>'
          +(d?'<div class="footnote mortar">'+esc(d)+'</div>':"")
          +'<div class="caption mortar">&rsaquo;</div></div></button>';
      }
      if(i<rws.length-1) h+='<div class="srule"></div>';
    });
    h+='</div></div>';
  });
  h+='<button class="group" data-a="replayOnboarding" style="display:block;width:100%">'
    +'<div class="srow"><div class="t">Replay onboarding</div>'
    +'<div class="caption mortar">&rsaquo;</div></div></button>'
    +'<div class="group"><div class="srow"><div class="t mortar">Sign out</div></div></div>'
    +'<div class="footnote mortar center">Arch 1.0</div></div></div></div>';
  return h;
}

function NOTE(t){return '<div class="footnote mortar">'+t+'</div>';}
function HEADING(t){return '<div class="titleL">'+esc(t)+'</div>';}
function opts(list,chosen,act){
  return '<div class="v gap-xs">'+list.map(function(o){
    return '<button data-a="'+act+'" data-o="'+esc(o)+'" style="display:block;width:100%">'
      +'<div class="opt '+(chosen===o?"sel":"")+'">'+esc(o)+'</div></button>';}).join("")+'</div>';
}
function sect(t,b){return '<div class="v gap-xs"><div class="subhead">'+t+'</div>'
  +'<div class="body mortar">'+b+'</div></div>';}

const SET_TITLES={"a-phone":"Phone number","a-email":"Email","a-premium":"Arch Premium",
  "n-time":"Time","d-distance":"Distance","d-age":"Age range","d-intent":"Looking for",
  "p-visible":"Who can see me","p-blocked":"Blocked people","p-data":"Download your data",
  "h-how":"How Arch works","h-safety":"Safety","h-contact":"Contact us"};

function settingDetail(id){

    b='<div class="v gap-s">'+HEADING("Within "+x.distance+" miles")
     +'<input class="slider" type="range" min="1" max="50" value="'+x.distance+'" data-s="distance">'
     +'<div style="display:flex; justify-content:space-between" class="footnote mortar">'
     +'<span>1 mile</span><span>50 miles</span></div></div>'
     +NOTE("Everyone in your five is inside this. Widening it gives Arch more people to choose five from &mdash; it does not give you more than five.");
  } else if(id==="d-age"){
    b='<div class="v gap-s">'+HEADING(x.minAge+" to "+x.maxAge)
     +'<div id="rangeTrack" class="rangetrack"><div class="rangefill"></div>'
     +'<div class="knobR" data-k="min"></div><div class="knobR" data-k="max"></div></div>'
     +'<div style="display:flex; justify-content:space-between" class="footnote mortar">'
     +'<span>18</span><span>70</span></div></div>'
     +NOTE("Arch will not put anyone outside this in your five, and will not put you in theirs.");
  } else if(id==="d-intent"){
    b=opts(["Something serious","Still working it out","Something casual"],x.intent,"setIntent")
     +NOTE("This is used to choose your five. It is not shown on your profile, and nobody is told what you picked.");
  } else if(id==="n-time"){
    b=opts(["7:00","8:00","9:00","10:00","12:00","18:00"],x.time,"setTime")
     +NOTE("Your five are ready at the same time every day. This only changes when Arch tells you about them.");
  } else if(id==="p-visible"){
    b=opts(["Anyone Arch picks me for","Nobody new while I have unread messages"],x.visibility,"setVisibility")
     +NOTE("Either way you keep the people already in your five, and they keep you. To come off Arch entirely, pause your profile.");
  } else if(id==="p-blocked"){
    b='<div class="titleM">Nobody blocked</div>'
     +NOTE("Blocking someone takes them out of your five, stops them appearing again, and stops you appearing in theirs. They are not told.");
  } else if(id==="p-data"){
    b='<div class="titleM">Everything Arch holds about you</div><div class="v gap-s">'
     +'<div class="body">Your profile, including photos and answers.</div>'
     +'<div class="body">Your questionnaire answers.</div>'
     +'<div class="body">Every message you have sent and received.</div>'
     +'<div class="body">Who has been in your five, and when.</div></div>'
     +NOTE("Sent as a file to "+esc(x.email)+". It usually takes a few minutes and never more than 30 days.")
     +'<button class="btn quiet">Request my data</button>';
  } else if(id==="a-phone"){
    b=HEADING(x.phone)
     +NOTE("This is how Arch knows you are a person. It is never shown to anyone and never appears on your profile.")
     +'<button class="btn quiet">Change number</button>'
     +NOTE("You will have to verify the new number before it takes effect.");
  } else if(id==="a-email"){
    b='<div class="field onNight"><input value="'+esc(x.email)+'" data-s="email"></div>'
     +NOTE("Used for signing in and account notices. Never shown to anyone, and Arch does not send anything else here.");
  } else if(id==="a-premium"){
    b=HEADING(x.sub?"Subscribed":"Not subscribed")
     +NOTE("Premium changes what you can do with your slots and how much you can say about yourself. It does not change who sees you.")
     +'<button class="btn primary" data-a="goPremium">See what premium changes</button>'
     +'<div class="btntext">Restore purchases</div>';
  } else if(id==="h-how"){
    b=sect("Five people, held","You have five slots. Arch fills them with people it thinks you would actually like, and they stay there. There is nothing to work through and no queue to clear &mdash; if you do nothing, they stay.")
     +sect("Dismissing costs you a slot","If you dismiss someone, that slot sits open until tomorrow morning. It is meant to be a real decision, which is why Arch asks you to confirm it and why there is no way to swipe.")
     +sect("There is no match step","Nobody has to like you back before you can write. If you want to talk to someone in your five, you write to them.")
     +sect("You are never told who dismissed whom","People leave your five. Sometimes that is you, sometimes it is them, and Arch does not tell you which. An open slot looks the same either way, on purpose.")
     +sect("The questions do the choosing","Your questionnaire answers are how Arch decides who reaches you. They are not on your profile, nobody else sees them, and they do not add up to a score.");
  } else if(id==="h-safety"){
    b=sect("Every account has a verified number","It is not a guarantee that someone is who they say, but it makes throwaway accounts expensive, which is most of the problem.")
     +sect("Blocking is silent and complete","A blocked person leaves your five, stops appearing again, and stops seeing you. They are not told.")
     +sect("Reporting","Report anyone from the top of a conversation. Reports go to a person, not a filter.")
     +sect("Meeting","Meet somewhere public the first time, tell someone where you are going, and get yourself home.");
  } else if(id==="h-contact"){

     +sect("Something is wrong with someone","Report them from the conversation rather than emailing &mdash; it comes through with the context attached.")
     +'<button class="btn quiet">Email help@arch.app</button>';

  return navbar(SET_TITLES[id]||"Setting")

/* ============================ onboarding ============================ */
const STEPS=["verify","identity","about","photos","answers","interests","questions","notifications"];
function onboarding(){
  const o=S.onboarding;
  if(o.welcome){
    return `<div class="screen"><div class="pad v" style="height:100%; padding:48px 20px">
      <div style="flex:1"></div>${markSVG(84,4,"var(--lamp)")}
      <div class="display mt-m">Arch</div><div style="flex:1"></div>
      <div class="titleL">Five people a day</div>
      <div class="body mortar mt-s">Every morning Arch picks five people it thinks you would
        actually like. You read them properly, you decide, and then you are done until tomorrow.</div>
      <div style="flex:1"></div>
      <button class="btn primary" data-a="obStart">Get started</button></div></div>`;
  }
  const step=STEPS[o.step];
  const inQ=o.q!==null&&o.q!==undefined;
  const total=inQ?QUESTIONS.length:STEPS.length, cur=inQ?o.q+1:o.step+1;
  let segs=""; for(let i=0;i<total;i++) segs+=`<div class="seg ${i<cur?"on":""}"></div>`;
  let body="",foot="",cta="Continue",enabled=true;

  if(step==="verify"&&!o.sent){
    body=`<div class="titleL">Your number</div>
      <div class="body mortar mt-s">Arch verifies every number. It is the main thing keeping this
        from filling up with accounts that are not people.</div>
      <div style="display:flex; gap:8px" class="mt-xl">
        <div class="field onNight" style="flex:none"><span class="mortar">+1</span></div>
        <div class="field onNight" style="flex:1"><input id="obPhone" inputmode="tel"
          placeholder="917 555 0142" value="${esc(o.phone)}"></div></div>
      <div class="footnote mortar mt-xl">Your number is never shown to anyone and never appears
        on your profile.</div>`;
    cta="Send a code"; enabled=o.phone.replace(/\D/g,"").length>=7;
  } else if(step==="verify"){
    let boxes=""; for(let i=0;i<6;i++) boxes+=`<div class="field onNight center"
      style="flex:1; justify-content:center; height:56px"><span class="titleM">${o.code[i]||""}</span></div>`;
    body=`<div class="titleL">Check your messages</div>
      <div class="body mortar mt-s">We sent a six-digit code to +1 ${esc(o.phone)}.</div>
      <div style="display:flex; gap:8px" class="mt-xl">${boxes}</div>
      <input id="obCode" inputmode="numeric" maxlength="6" value="${esc(o.code)}"
        style="position:absolute; opacity:.001; width:1px; height:1px">
      <button class="footnote mortar mt-xl" data-a="obResend">Send it again</button>`;
    cta="Verify"; enabled=o.code.length===6;
  } else if(step==="identity"){
    body=`<div class="titleL">Your name</div>
      <div class="body mortar mt-s">This is what people see. Your email is only for signing in.</div>
      <div class="v gap-xs mt-xl">
        <div class="field onNight"><div class="lbl">Name</div><input id="obName" value="${esc(o.name)}" placeholder="Sam"></div>
        <div class="field onNight"><div class="lbl">Email</div><input id="obEmail" value="${esc(o.email)}" placeholder="sam@example.com"></div></div>`;
    enabled=o.name.trim()&&o.email.includes("@");
  } else if(step==="about"){
    const loc=[o.hood.trim(),o.city.trim()].filter(Boolean).join(", ");
    body=`<div class="titleL">About you</div>
      <div class="body mortar mt-s">Four facts that sit under your name.</div>
      <div class="v gap-xs mt-xl">
        <div class="field onNight"><div class="lbl">Age</div><input id="obAge" inputmode="numeric" value="${esc(o.age)}" placeholder="30"></div>
        <div class="field onNight"><div class="lbl">Neighbourhood</div><input id="obHood" value="${esc(o.hood)}" placeholder="Fort Greene"></div>
        <div class="field onNight"><div class="lbl">City</div><input id="obCity" value="${esc(o.city)}" placeholder="Brooklyn"></div>
        <div class="field onNight"><div class="lbl">Height</div><input id="obHeight" value="${esc(o.height)}" placeholder="5 ft 10"></div>
        <div class="field onNight"><div class="lbl">Work</div><input id="obWork" value="${esc(o.work)}" placeholder="Sound engineer"></div></div>
      ${loc?`<div class="v gap-xs mt-l"><div class="footnote mortar">People will see this as</div>
        <div class="chips"><div class="chip">${esc(loc)}</div></div></div>`:""}`;
    enabled=o.age&&o.hood.trim()&&o.city.trim()&&o.height.trim()&&o.work.trim();
  } else if(step==="photos"){
    let slots=o.photos.map((t,i)=>`<div class="slot" style="${tone(t)}">
      <button class="x" data-a="obRmPhoto" data-i="${i}">✕</button></div>`).join("");
    if(o.photos.length<6) slots+=`<button class="slot add" data-a="obAddPhoto">+</button>`;
    const short=Math.max(0,4-o.photos.length);
    body=`<div class="titleL">Photos</div>
      <div class="body mortar mt-s">At least 4, up to 6. The first one is what people see in their five.</div>
      <div class="grid3 mt-xl">${slots}</div>
      <div class="footnote mortar mt-s">${short===0?`You can add ${6-o.photos.length} more.`
        :short===1?"One more photo.":`${short} more photos.`}</div>`;
    enabled=o.photos.length>=4;
  } else if(step==="answers"){
    body=`<div class="titleL">Three answers</div>
      <div class="body mortar mt-s">This is the part people actually read.</div><div class="v gap-m mt-xl">`;
    o.answers.forEach((a,i)=>{body+=`<div class="v gap-xs">
      <div class="prompt mortar">${esc(YOU.prompts[i][0])}</div>
      <div class="field onNight"><textarea rows="3" data-ob="answer" data-i="${i}"
        placeholder="Answer it properly.">${esc(a)}</textarea></div></div>`;});
    body+=`</div>`;
    enabled=o.answers.filter(a=>a.trim()).length>=3;
  } else if(step==="interests"){
    const ex=["Night baking","Rolleiflex repair","Above-ground platforms"];
    body=`<div class="titleL">Three interests</div>
      <div class="body mortar mt-s">Short and specific. "Bridge inspections" tells someone more
        than "travel" ever will.</div><div class="v gap-xs mt-xl">`;
    o.interests.forEach((t,i)=>{body+=`<div class="field onNight"><input maxlength="24"
      data-ob="interest" data-i="${i}" value="${esc(t)}" placeholder="${ex[i]}"></div>`;});
    body+=`</div>`;
    enabled=o.interests.filter(t=>t.trim()).length>=3;
  } else if(step==="questions"&&!inQ){
    body=`<div class="titleL">A few questions</div>
      <div class="body mortar mt-s">These are how Arch decides who reaches your five.</div>
      <div class="v gap-m mt-xl">
        <div class="body">Your answers are not on your profile.</div>
        <div class="body">Nobody else sees them.</div>
        <div class="body">They do not add up to a score, and Arch will never show you a percentage.</div></div>
      <div class="footnote mortar mt-xl">${QUESTIONS.length} questions. There is no wrong answer.</div>`;
    cta="Start";
  } else if(step==="questions"){
    const [q,opts]=QUESTIONS[o.q];
    body=`<div class="titleM">${esc(q)}</div><div class="v gap-xs mt-xl">`;
    opts.forEach(opt=>{body+=`<button data-a="obAnswer" data-o="${esc(opt)}" style="display:block;width:100%">
      <div class="opt ${o.qa[o.q]===opt?"sel":""}">${esc(opt)}</div></button>`;});
    body+=`</div>`;
  } else {
    body=`<div class="titleL">Notifications</div>
      <div class="body mortar mt-s">Two kinds, and nothing else.</div>
      <div class="v gap-m mt-xl">
        <div class="body">One in the morning, when your five are ready.</div>
        <div class="body">One when somebody writes to you.</div></div>
      <div class="footnote mortar mt-xl">No reminders to come back, and nothing at all in the evening.</div>`;
    cta="Allow notifications";
  }

  if(!inQ){
    foot=`<div class="bottombar"><button class="btn primary" data-a="obNext" ${enabled?"":"disabled"}>${cta}</button>
      ${step==="notifications"?`<button class="btntext" data-a="obFinish">Not now</button>`:""}</div>`;
  }
  return `<div class="v" style="flex:none; padding-bottom:12px"><div class="safetop"></div>
      <div style="display:flex; padding-left:8px">
        ${o.step>0||o.sent||inQ?`<button class="iconbtn" data-a="obBack">‹</button>`
          :`<div style="width:44px;height:44px"></div>`}</div>
      <div class="rule pad">${segs}</div></div>
    <div class="screen"><div class="pad pb-xxxl" style="padding-top:24px; position:relative">${body}</div></div>${foot}`;
}

/* ============================ render ============================ */
function render(){
  const r=document.getElementById("root");
  if(S.onboarding){ r.innerHTML=onboarding(); return; }
  const t=current();
  let screen;
  if(!t){
    screen={premium:premiumRoot,daily:dailyRoot,messages:messagesRoot,you:youRoot}[S.tab]();
  } else if(t.name==="profile") screen=profile(t.id);
  else if(t.name==="thread") screen=thread(t.id);
  else if(t.name==="requests") screen=requestsRoot();
  else if(t.name==="arrange") screen=arrange();
  else if(t.name==="settings") screen=settings();
  else if(t.name==="settingDetail") screen=settingDetail(t.id);

  const hideTabs=t&&(t.name==="thread");
  const unread=S.convos.reduce((a,c)=>a+c.unread,0);
  const tabs=["premium","daily","messages","you"].map(k=>{
    const label={premium:"Premium",daily:"Daily 5",messages:"Messages",you:"You"}[k];
    const badge=(k==="messages"&&unread)?`<div class="badge">${unread}</div>`:"";
    return `<button class="tab" data-a="tab" data-k="${k}" aria-selected="${S.tab===k}">
      <div class="glyph">${glyph(k,S.tab===k)}${badge}</div><div class="lbl">${label}</div></button>`;
  }).join("");
  r.innerHTML=screen+(hideTabs?"":`<div class="tabbar">${tabs}</div>`);
}

/* ============================ sheets ============================ */
function openSheet(html){
  const s=document.getElementById("sheet"), sc=document.getElementById("scrim");
  s.innerHTML=`<div class="grabber"></div>`+html;
  requestAnimationFrame(()=>{s.classList.add("on"); sc.classList.add("on");});
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
function dismissSheet(id){
  const p=[...PEOPLE,HANA].find(x=>x.id===id);
  openSheet(`<div class="v gap-s" style="padding-top:8px">
    <div class="titleM">Dismiss ${esc(p.name)}?</div>
    <div class="body mortar">${esc(p.name)} leaves your five. The slot fills with someone new
      tomorrow. You cannot undo this.</div></div>
    <button class="btn quiet mt-xxl" data-a="confirmDismiss" data-id="${id}">Dismiss ${esc(p.name)}</button>
    <button class="btntext" data-a="closeSheet">Cancel</button>`);
}
/* Sending has a price, and hiding it until afterwards would be a trick. Spending a
   slot on somebody you want to talk to is what a slot is for. */
function COST(p){
  let t="Sending takes "+esc(p.name)+" out of your five. That slot fills with someone new tomorrow.";
  if(openConvos().length+1>=S.LIMIT)
    t+=" It also takes you to "+S.LIMIT+" conversations, so your five will wait until you leave one.";
  return '<div class="footnote mortar mt-m">'+t+'</div>';
}

function composerSheet(id){
  const p=[...PEOPLE,HANA].find(x=>x.id===id);
  let q="";
  if(S.selected){
    const [kind,i]=S.selected.split("-");

      ? `<div class="quoted mt-m"><div class="footnote mortar">${esc(p.prompts[+i][0])}</div>
         <div class="callout" style="margin-top:4px; display:-webkit-box; -webkit-line-clamp:2;

         <div style="width:40px; height:50px; border-radius:8px; ${tone(p.photos[+i])}"></div>
         <div class="footnote mortar">About this photo</div></div>`;

  openSheet(`<div style="display:flex; gap:12px; align-items:center; padding-top:8px">

/* Question and answer are one decision, so they live in one sheet. Changing the
   question clears the answer — an answer written for a different question is a non
   sequitur — but nothing commits until Save. */
function answerSheet(){
  const e=S.edit;
  if(e.choosing){
    openSheet('<div class="v gap-s" style="padding-top:4px">'
      +'<div style="display:flex; align-items:center; gap:8px">'
      +'<button class="iconbtn" data-a="pickCancel" style="margin-left:-12px">&lsaquo;</button>'
      +'<div class="titleM">Choose a question</div></div></div>'
      +'<div class="mt-m">'+promptPicker(e.question,e.taken)+'</div>');
    return;
  }
  openSheet('<button data-a="pickOpen" style="display:block;width:100%">'
    +'<div style="display:flex; gap:12px; align-items:baseline; padding-top:4px">'
    +'<div class="prompt mortar" style="flex:1">'+esc(e.question)+'</div>'
    +'<div class="footnote mortar">Change</div></div></button>'
    +'<div class="field mt-m" style="align-items:flex-start">'
    +'<textarea id="answerText" rows="6" placeholder="Answer it properly.">'+esc(e.answer)+'</textarea></div>'
    +'<button class="btn primary mt-m" data-a="saveAnswer">Save</button>'
    +'<button class="btntext" data-a="closeSheet">Cancel</button>');
}


/* Report, block, leave.
   A sheet rather than a native menu: all three are consequential enough to need a
   line saying what they do, and a menu row cannot carry one. */
const REPORT_REASONS=["They were abusive or harassing","Their photos are not them",
  "They are underage","They are trying to sell something","Something else"];

function inRoster(personId){ return S.slots.some(s=>s.person&&s.person.id===personId); }

function convoMenuSheet(id){
  const c=S.convos.find(x=>x.id===id), n=esc(c.person.name), held=inRoster(c.person.id);
  const row=(act,title,detail)=>
    '<button data-a="'+act+'" data-id="'+id+'" style="display:block;width:100%">'
    +'<div class="opt" style="background:var(--stoneRaised)">'
    +'<div class="body">'+title+'</div>'
    +'<div class="footnote mortar" style="margin-top:4px">'+detail+'</div></div></button>';
  openSheet('<div class="v gap-xs" style="padding-top:4px">'
    +row("reportOpen","Report "+n,"Reports go to a person, not a filter.")
    +row("blockOpen","Block "+n,"They stop seeing you and stop appearing again. They are not told.")
    +row("leaveOpen","Leave this conversation",
         held?("Removes the conversation, and takes "+n+" out of your five.")
             :"Removes the conversation.")
    +'</div>');
}

function blockSheet(id){
  const c=S.convos.find(x=>x.id===id), n=esc(c.person.name), held=inRoster(c.person.id);
  openSheet('<div class="titleM" style="padding-top:8px">Block '+n+'?</div>'
    +'<div class="body mortar mt-s">'
    +(held?(n+" leaves your five, and "):"")
    +"the conversation is removed. "+n+" will not appear again and will not see you. "
    +n+" is not told. You can undo this in Settings.</div>"
    +'<button class="btn quiet mt-xxl" data-a="blockDo" data-id="'+id+'">Block '+n+'</button>'
    +'<button class="btntext" data-a="closeSheet">Cancel</button>');
}

function leaveSheet(id){
  const c=S.convos.find(x=>x.id===id), n=esc(c.person.name), held=inRoster(c.person.id);
  openSheet('<div class="titleM" style="padding-top:8px">Leave this conversation?</div>'
    +'<div class="body mortar mt-s">'
    +(held?("The conversation is removed and "+n+" leaves your five. That slot fills with someone new tomorrow. You cannot undo this.")
          :"The conversation is removed. You cannot undo this.")
    +'</div>'
    +'<button class="btn quiet mt-xxl" data-a="leaveDo" data-id="'+id+'">Leave</button>'
    +'<button class="btntext" data-a="closeSheet">Cancel</button>');
}

function reportSheet(id){
  const c=S.convos.find(x=>x.id===id), n=esc(c.person.name), r=S.report;
  if(r.sent){
    openSheet('<div class="titleM" style="padding-top:8px">Report sent</div>'
      +'<div class="body mortar mt-s">A person will read it within a day, with the conversation '
      +'attached. '+(r.block?(n+" has been blocked and is not told about either.")
                            :(n+" is not told."))+'</div>'
      +'<button class="btn primary mt-xxl" data-a="reportDone" data-id="'+id+'">Done</button>');
    return;
  }
  const opts=REPORT_REASONS.map(o=>
    '<button data-a="reportReason" data-o="'+esc(o)+'" data-id="'+id+'" style="display:block;width:100%">'
    +'<div class="opt '+(r.reason===o?"sel":"")+'">'+esc(o)+'</div></button>').join("");
  openSheet('<div class="titleM" style="padding-top:8px">Report '+n+'</div>'
    +'<div class="footnote mortar mt-s">A person reads every report, with this conversation '
    +'attached. You do not need to explain twice.</div>'
    +'<div class="v gap-xs mt-m">'+opts+'</div>'
    +'<button data-a="reportToggle" data-id="'+id+'" style="display:block;width:100%">'
    +'<div class="srow" style="padding:16px 0"><div class="t">Block '+n+' as well</div>'
    +'<div class="switch '+(r.block?"on":"")+'"><div class="knob"></div></div></div></button>'
    +'<button class="btn primary'+(r.reason?"":" btn-off")+'" data-a="reportSend" data-id="'+id+'">Send report</button>'
    +'<button class="btntext" data-a="closeSheet">Cancel</button>');
}

/* Leaving takes the person out of your five as well. Anything else makes it
   weightless — they would still hold a slot and could write straight back. */
function removePerson(personId,alsoConversation,theirs){
  if(alsoConversation) S.convos=S.convos.filter(c=>c.person.id!==personId);
  const i=S.slots.findIndex(s=>s.person&&s.person.id===personId);
  if(i>=0) S.slots[i]={person:null,when:"A new person arrives tomorrow.",
                       left:"Nine in the morning",theirs:!!theirs};
}

/* ============================ the dismissal ============================ */
function performDismiss(id){
  closeSheet();
  const idx=S.slots.findIndex(s=>s.person&&s.person.id===id);
  if(idx<0) return;
  // Come back to the roster first, so nothing vanishes under the cursor.
  S.stacks.daily=[]; S.tab="daily"; render();

  const filled=S.slots.filter(s=>s.person).length;
  const card=document.querySelector(`[data-card="${id}"]`);
  const stones=document.querySelectorAll("#arch path");
  const stone=stones[filled-1];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const finish=()=>{
    S.slots[idx]={person:null,when:"A new person arrives tomorrow.",left:"About 14 hours"};
    S.selected=null; render();
  };
  if(!card||reduce){ setTimeout(finish,120); return; }

  if(stone) stone.classList.add("stone-drop");
  card.style.height=card.offsetHeight+"px";
  card.classList.add("leaving");
  requestAnimationFrame(()=>{
    card.style.transition="height .26s ease-in, opacity .26s ease-in, margin .26s ease-in";
    card.style.height="0px"; card.style.opacity="0"; card.style.marginBottom="-32px";
  });
  setTimeout(finish,320);
}

/* ============================ events ============================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id, o=S.onboarding;

  const acts={
    tab:()=>{S.tab=el.dataset.k; S.selected=null; render();},
    open:()=>{S.selected=null; push({name:"profile",id});},
    back:()=>pop(),
    select:()=>{S.selected=S.selected===el.dataset.k?null:el.dataset.k; render();},
    dismiss:()=>dismissSheet(id),
    closeSheet:()=>closeSheet(),
    confirmDismiss:()=>performDismiss(id),
    compose:()=>composerSheet(id),
    thread:()=>push({name:"thread",id}),
    openRequests:()=>push({name:"requests"}),
    acceptReq:()=>{
      const c=S.convos.find(x=>x.id===id); c.state="open"; c.unread=0;
      S.stacks.messages=[{name:"thread",id:c.id}]; S.tab="messages"; render();
    },
    declineReq:()=>{
      // They are not told, the same as everything else here.
      S.convos=S.convos.filter(x=>x.id!==id);
      S.stacks.messages=[]; render();
    },
    goDaily:()=>{S.tab="daily"; render();},
    goMessages:()=>{S.tab="messages"; render();},
    plan:()=>{S.plan=+el.dataset.i; render();},
    arrange:()=>push({name:"arrange"}),
    settings:()=>push({name:"settings"}),
    setting:()=>push({name:"settingDetail",id:el.dataset.id}),
    toggleSetting:()=>{const k=TOGGLES[el.dataset.id]; S.set[k]=!S.set[k]; render();},
    setIntent:()=>{S.set.intent=el.dataset.o; render();},
    setTime:()=>{S.set.time=el.dataset.o; render();},
    setVisibility:()=>{S.set.visibility=el.dataset.o; render();},
    goPremium:()=>{S.stacks.you=[]; S.tab="premium"; render();},
    addPhoto:()=>{S.you.photos.push(S.you.photos.length%6); render();},
    rmPhoto:()=>{S.you.photos.splice(+el.dataset.i,1); render();},
    editInterests:()=>openSheet(`<div class="titleM" style="padding-top:8px">Interests</div>
      <div class="footnote mortar mt-s">Three things you are actually into.</div>
      <div class="v gap-xs mt-m">${S.you.interests.map(t=>
        `<div class="field"><input value="${esc(t)}" maxlength="24"></div>`).join("")}</div>
      <button class="btn primary mt-m" data-a="closeSheet">Save</button>
      <button class="btntext" data-a="closeSheet">Cancel</button>`),
    editDetails:()=>openSheet(`<div class="titleM" style="padding-top:8px">Your details</div>
      <div class="v gap-xs mt-m">
        ${[["Name",S.you.name],["Age",S.you.age],["Neighbourhood",S.you.hood],["City",S.you.city],
           ["Height",S.you.h],["Work",S.you.work]].map(([l,v])=>
        `<div class="field"><div class="lbl">${l}</div><input value="${esc(v)}"></div>`).join("")}</div>
      <div class="footnote mortar mt-s">Your neighbourhood and city show together, as
        ${esc(S.you.hood)}, ${esc(S.you.city)}.</div>
      <button class="btn primary mt-m" data-a="closeSheet">Save</button>
      <button class="btntext" data-a="closeSheet">Cancel</button>`),
    convoMenu:()=>convoMenuSheet(id),
    blockOpen:()=>{ closeSheet(); setTimeout(()=>blockSheet(id),220); },
    leaveOpen:()=>{ closeSheet(); setTimeout(()=>leaveSheet(id),220); },
    reportOpen:()=>{ S.report={reason:null,block:true,sent:false};
      closeSheet(); setTimeout(()=>reportSheet(id),220); },
    reportReason:()=>{ S.report.reason=el.dataset.o; reportSheet(id); },
    reportToggle:()=>{ S.report.block=!S.report.block; reportSheet(id); },
    reportSend:()=>{ if(!S.report.reason) return; S.report.sent=true; reportSheet(id); },
    reportDone:()=>{
      const c=S.convos.find(x=>x.id===id);
      // Reporting on its own removes nothing — you reported them, you did not ask
      // to lose the conversation.
      if(S.report.block) removePerson(c.person.id,true);
      closeSheet(); S.stacks.messages=[]; S.stacks.daily=[]; render();
    },
    blockDo:()=>{
      const c=S.convos.find(x=>x.id===id);
      removePerson(c.person.id,true);
      closeSheet(); S.stacks.messages=[]; S.stacks.daily=[]; render();
    },
    leaveDo:()=>{
      const c=S.convos.find(x=>x.id===id);
      removePerson(c.person.id,true);
      closeSheet(); S.stacks.messages=[]; S.stacks.daily=[]; render();
    },
    editAnswer:()=>{
      const i=+el.dataset.i;
      S.edit={i:i, question:S.you.prompts[i][0], answer:S.you.prompts[i][1], choosing:false,
              taken:S.you.prompts.filter((_,j)=>j!==i).map(p=>p[0])};
      answerSheet();
    },
    pickOpen:()=>{
      const t=document.getElementById("answerText");
      if(t) S.edit.answer=t.value;
      S.edit.choosing=true; answerSheet();
    },
    pickCancel:()=>{ S.edit.choosing=false; answerSheet(); },
    pickQuestion:()=>{
      const q=el.dataset.q;
      if(q!==S.edit.question){ S.edit.question=q; S.edit.answer=""; }
      S.edit.choosing=false; answerSheet();
    },
    saveAnswer:()=>{
      const t=document.getElementById("answerText");
      const text=(t&&t.value.trim())||"";
      if(!text) return;
      S.you.prompts[S.edit.i]=[S.edit.question,text];
      S.edit=null; closeSheet(); render();
    },
    replayOnboarding:()=>{startOnboarding(); },
    threadSend:()=>{
      const i=document.getElementById("threadInput"); if(!i||!i.value.trim()) return;
      const c=S.convos.find(x=>x.id===current().id);
      c.msgs.push(["out",i.value.trim(),"Just now"]); c.when="Just now"; render();
      const sc=document.querySelector(".screen"); if(sc) sc.scrollTop=sc.scrollHeight;
    },
    send:()=>{
      const t=document.getElementById("composeText");
      const text=(t&&t.value.trim())||"";
      if(!text) return;
      const p=[...PEOPLE,HANA].find(x=>x.id===id);
      let c=S.convos.find(x=>x.id===id);
      const openRef=S.selected&&S.selected.startsWith("prompt")
        ? ["prompt",+S.selected.split("-")[1]] : ["prompt",0];
      if(!c){ c={id,person:p,open:openRef,unread:0,when:"Just now",msgs:[]}; S.convos.unshift(c); }
      c.msgs.push(["out",text,"Just now"]); c.when="Just now";
      // Writing to them spends the slot.
      removePerson(id,false);
      closeSheet(); S.selected=null;
      S.tab="messages"; S.stacks.messages=[{name:"thread",id}]; render();
    },
    /* onboarding */
    obStart:()=>{o.welcome=false; render();},
    obBack:()=>{
      if(o.q!==null&&o.q!==undefined){ o.q=o.q===0?null:o.q-1; render(); return; }
      if(o.step===0&&o.sent){ o.sent=false; o.code=""; render(); return; }
      if(o.step>0){ o.step--; render(); }
    },
    obResend:()=>{el.textContent="Code sent again";},
    obAddPhoto:()=>{o.photos.push(o.photos.length%6); render();},
    obRmPhoto:()=>{o.photos.splice(+el.dataset.i,1); render();},
    obAnswer:()=>{
      o.qa[o.q]=el.dataset.o; render();
      setTimeout(()=>{
        if(o.q+1<QUESTIONS.length) o.q++;
        else { o.q=null; o.step=STEPS.indexOf("notifications"); }
        render();
      },260);
    },
    obNext:()=>{
      const step=STEPS[o.step];
      if(step==="verify"&&!o.sent){ o.sent=true; render(); return; }
      if(step==="questions"&&(o.q===null||o.q===undefined)){ o.q=0; render(); return; }
      if(step==="notifications"){ finishOnboarding(); return; }
      o.step++; render();
    },
    obFinish:()=>finishOnboarding()
  };
  if(acts[a]){ e.preventDefault(); acts[a](); }
});

/* live input */
document.addEventListener("input",e=>{
  const t=e.target, o=S.onboarding;
  if(t.dataset.s==="distance"){ S.set.distance=+t.value;
    const h=document.querySelector(".titleL"); if(h) h.textContent="Within "+t.value+" miles"; return; }
  if(t.dataset.s==="email"){ S.set.email=t.value; return; }
  if(o){
    const map={obPhone:"phone",obCode:"code",obName:"name",obEmail:"email",obAge:"age",
               obHood:"hood",obCity:"city",obHeight:"height",obWork:"work"};
    if(map[t.id]){
      o[map[t.id]]=t.id==="obCode"?t.value.replace(/\D/g,"").slice(0,6):t.value;
      const btn=document.querySelector('[data-a="obNext"]');
      if(t.id==="obCode"){ render(); document.getElementById("obCode")?.focus(); return; }
      if(btn) refreshCTA();
      return;
    }
    if(t.dataset.ob==="answer"){ o.answers[+t.dataset.i]=t.value; refreshCTA(); return; }
    if(t.dataset.ob==="interest"){ o.interests[+t.dataset.i]=t.value; refreshCTA(); return; }
  }
});
function refreshCTA(){
  const o=S.onboarding, step=STEPS[o.step];
  let ok=true;
  if(step==="verify"&&!o.sent) ok=o.phone.replace(/\D/g,"").length>=7;
  else if(step==="verify") ok=o.code.length===6;
  else if(step==="identity") ok=!!o.name.trim()&&o.email.includes("@");
  else if(step==="about") ok=!!(o.age&&o.hood.trim()&&o.city.trim()&&o.height.trim()&&o.work.trim());
  else if(step==="answers") ok=o.answers.filter(a=>a.trim()).length>=3;
  else if(step==="interests") ok=o.interests.filter(t=>t.trim()).length>=3;
  const btn=document.querySelector('[data-a="obNext"]');
  if(btn) btn.disabled=!ok;
}

function startOnboarding(){
  S.onboarding={welcome:true,step:0,sent:false,phone:"",code:"",name:"",email:"",
    age:"",hood:"",city:"",height:"",work:"",photos:[],answers:["","",""],
    interests:["","",""],q:null,qa:{}};
  render();
}
function finishOnboarding(){
  const o=S.onboarding;
  if(o.name.trim()){
    S.you.name=o.name.trim(); S.you.age=o.age||S.you.age; S.you.hood=o.hood||S.you.hood;
    S.you.city=o.city||S.you.city; S.you.h=o.height||S.you.h; S.you.work=o.work||S.you.work;
    if(o.photos.length>=4) S.you.photos=o.photos.slice();
    o.answers.forEach((a,i)=>{ if(a.trim()) S.you.prompts[i][1]=a.trim(); });
    const ints=o.interests.filter(t=>t.trim());
    if(ints.length) S.you.interests=ints;
  }
  S.onboarding=null; S.tab="daily"; S.stacks={premium:[],daily:[],messages:[],you:[]};
  render();
}


/* The age range: two handles on one track. Pointer events so it works on a phone. */
function mountRange(){
  const track=document.getElementById("rangeTrack"); if(!track) return;
  const fill=track.querySelector(".rangefill");
  const knobs={min:track.querySelector('[data-k="min"]'),max:track.querySelector('[data-k="max"]')};
  const LO=18, HI=70, KNOB=26;
  const paint=()=>{
    const w=track.clientWidth-KNOB, span=HI-LO;
    const xl=(S.set.minAge-LO)/span*w, xh=(S.set.maxAge-LO)/span*w;
    knobs.min.style.left=xl+"px"; knobs.max.style.left=xh+"px";
    fill.style.left=(xl+KNOB/2)+"px"; fill.style.width=Math.max(0,xh-xl)+"px";
    const h=document.querySelector(".titleL");
    if(h) h.textContent=S.set.minAge+" to "+S.set.maxAge;
  };
  const drag=(which)=>(ev)=>{
    ev.preventDefault();
    const move=(e)=>{
      const p=(e.touches?e.touches[0].clientX:e.clientX);
      const r=track.getBoundingClientRect(), w=r.width-KNOB;
      const v=Math.round(Math.min(Math.max(0,p-r.left-KNOB/2),w)/w*(HI-LO))+LO;
      if(which==="min") S.set.minAge=Math.min(v,S.set.maxAge-2);
      else S.set.maxAge=Math.max(v,S.set.minAge+2);
      paint();
    };
    const up=()=>{document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);};
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
  };
  knobs.min.addEventListener("pointerdown",drag("min"));
  knobs.max.addEventListener("pointerdown",drag("max"));
  paint();
}
const _render=render;
render=function(){ _render(); mountRange(); };

render();
</script>
