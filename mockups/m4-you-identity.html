<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>You profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --night:#191715; --stone:#232120; --stoneRaised:#2E2B29;
  --limestone:#F5EFE6; --mortar:#9A8F86; --lamp:#E5714D;
  --hairline:rgba(154,143,134,.12); --quiet:rgba(154,143,134,.20);
  --serif: "Fraunces", ui-serif, "New York", Georgia, serif;
  --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-variation-settings:"SOFT" 0,"WONK" 0; font-optical-sizing:auto; background:var(--night); color:var(--limestone); font-family:var(--sans); zoom:2;}
.phone{width:393px; height:430px; background:var(--night); overflow:hidden; position:relative;}
.pad{padding:0 20px;}

.t-titleL{font-family:var(--serif); font-size:30px; line-height:36px; font-weight:600;}
.t-titleM{font-family:var(--serif); font-size:24px; line-height:30px; font-weight:600;}
.t-prompt{font-family:var(--serif); font-size:19px; line-height:26px;}
.t-bodyL{font-size:20px; line-height:28px;}
.t-body{font-size:17px; line-height:24px;}
.t-subhead{font-size:15px; line-height:20px; font-weight:600;}
.t-footnote{font-size:13px; line-height:18px;}
.t-caption{font-size:12px; line-height:16px; font-weight:500;}
.mortar{color:var(--mortar);}
.hairline{height:.5px; background:var(--hairline);}

.hdr{display:flex; align-items:baseline; gap:12px; padding:16px 20px 16px;}
.hdr .sp{margin-left:auto;}
.gear{width:20px; height:20px; color:var(--mortar); font-size:17px; line-height:20px;}
.pencil{width:36px; height:36px; border-radius:18px; background:var(--stoneRaised);
        display:flex; align-items:center; justify-content:center; color:var(--limestone);
        font-size:15px; flex:none;}

.vitals{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.vital{background:var(--stone); border-radius:12px; padding:8px 12px;
       font-size:12px; line-height:16px; font-weight:500; color:var(--mortar);}

.chip{background:var(--stone); border-radius:12px; padding:8px 12px;
      font-size:13px; line-height:18px; color:var(--limestone);}
.chip-add{border:1px solid var(--quiet); background:transparent; color:var(--mortar);
          border-radius:12px; padding:8px 12px; font-size:13px; line-height:18px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}

.promptcard{background:var(--stone); border-radius:20px; padding:24px; position:relative;}
.promptcard .q{color:var(--mortar); margin-bottom:12px;}
.promptcard .pencil{position:absolute; right:12px; bottom:12px;}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.slot{aspect-ratio:1; border-radius:12px; position:relative;}
.slot .x{position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:12px;
         background:rgba(15,19,25,.75); color:var(--limestone); font-size:12px;
         display:flex; align-items:center; justify-content:center;}
.slot-add{background:var(--stone); display:flex; align-items:center; justify-content:center;
          color:var(--mortar); font-size:17px;}

.arow{background:var(--stone); border-radius:12px; padding:12px; display:flex;
      align-items:center; gap:12px; margin-bottom:8px;}
.arow .h{color:var(--mortar); font-size:15px;}
.arow .q{font-size:13px; line-height:18px; color:var(--limestone);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.group{background:var(--stone); border-radius:20px; overflow:hidden; margin-top:8px;}
.srow{display:flex; align-items:center; gap:12px; padding:16px;}
.srow .t{font-size:17px; line-height:24px;}
.srow .d{margin-left:auto; font-size:13px; line-height:18px; color:var(--mortar);}
.srow .c{color:var(--mortar); font-size:12px;}
.srule{height:.5px; background:var(--hairline); margin-left:16px;}
.slabel{font-size:13px; line-height:18px; color:var(--mortar); margin:24px 0 0 4px;}
</style></head><body>
<div class="phone"><div class="hdr"><div class="t-titleL">You</div><div class="sp t-footnote mortar">Arrange</div><div class="gear">&#9881;</div></div><div style="height:120px; background:linear-gradient(#383A3E,#303236);"></div><div class="t-footnote mortar" style="padding:4px 20px 0;">(lead photo continues above)</div><div class="pad" style="padding-top:20px;"><div style="display:flex; align-items:flex-start;"><div class="t-titleL">Sam</div><div style="margin-left:auto;"><div class="pencil">&#9998;</div></div></div><div class="vitals"><div class="vital">30</div><div class="vital">Fort Greene, Brooklyn</div><div class="vital">5 ft 10</div><div class="vital">Sound engineer</div></div></div></div></body></html>
