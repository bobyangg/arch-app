# Compiling Arch.
#
# Sixteen thousand lines of Swift were written on a Windows machine with no Swift
# toolchain. This is the first thing that has ever told us whether any of it is
# true. It needs no Mac and no paid developer account: GitHub's macOS runner is
# free on public repositories, and building for the simulator requires no signing.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that need no Xcode run first and separately, so a Swift failure
  # never hides a schema failure or the other way round.
  checks:
    name: Cross-reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install sqlparse

      - name: Swift names resolve
        run: python tools/swiftcheck.py Arch

      - name: SQL cross-references
        run: python backend/lint.py

      # All four run from the repository root. `working-directory: matcher` was
      # here and would have looked for matcher/matcher/selftest.py -- caught by
      # running them the way CI would rather than the way they are usually run.
      - name: The matcher agrees with itself
        run: python matcher/selftest.py

      - name: The compatibility tables still match the Swift
        run: python matcher/sqlgen.py --digest
        # Prints the two fingerprints. Compare against the database with:
        #   select digest, source_digest from compatibility_digest;

  build:
    name: Build for the simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the image, not a pinned one.
      #
      # Pinning 16.2 is what broke the first build: its SDK is iOS 18.2 and the
      # runner carries simulator runtimes for 18.5, 18.6 and 26.x, so the asset
      # catalog compiler could not find a runtime matching the SDK and failed
      # before a single line of Swift was read. Taking the newest keeps the SDK and
      # the runtimes on the image in step with each other, which is the property
      # that actually matters here.
      - name: Use the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -switch "$newest"
          xcodebuild -version

      # Printed so that the next runtime mismatch is one line to read rather than
      # a guess.
      - name: What this image actually has
        run: |
          ls -d /Applications/Xcode*.app
          xcrun simctl list runtimes || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # `-destination generic/platform=iOS Simulator` builds without booting a
      # simulator, which is faster and does not depend on which runtimes the
      # runner image happens to carry. The bundle it produces is installable on any
      # of them, which is what the launch step below needs.
      #
      # `-derivedDataPath` is here only so that the .app has a known address;
      # Xcode's default is a hashed directory under ~/Library.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Arch.xcodeproj \
            -scheme Arch \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # Warnings are gathered whether the build passed or failed.
      #
      # They are the only feedback this project has ever had, and a *successful*
      # build used to throw them away entirely -- the summary below is `if:
      # failure()`, so going green meant nobody knew whether there were two
      # warnings or two hundred. `SWIFT_TREAT_WARNINGS_AS_ERRORS` stays NO, and
      # this is the other half of that bargain: they do not stop the build, but
      # they do get counted and read.
      - name: The warnings, gathered
        if: always()
        run: python3 tools/warnings.py build.log

      # The first build of this project will not pass, so the error list is the
      # deliverable until it does.
      #
      # Emitted as workflow annotations as well as into the summary, because
      # **annotations are readable on a public repository without signing in and
      # logs are not.** That is what lets the errors be read straight off the run
      # rather than downloaded, unzipped and pasted by hand.
      - name: The errors, gathered
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          errors=$(grep -c 'error:' build.log || echo 0)
          warnings=$(grep -c 'warning:' build.log || echo 0)
          echo "Total: $errors errors, $warnings warnings" >> "$GITHUB_STEP_SUMMARY"

          # One annotation per distinct error, capped so a cascade of a thousand
          # does not bury the first real one.
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

          # xcodebuild's own summary lines say what it could not do at all, which
          # is a different and often more useful thing than a compile error.
          grep -E "^(\*\*|The following build commands failed|Command .* failed)" build.log \
            | sort -u | head -10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      # Compiling is not running.
      #
      # Everything above this proves the types line up. A force-unwrapped nil, a
      # font that is not in the bundle, a precondition in a store's `init`, a hang
      # in `ArchSession.start()` -- every one of those compiles perfectly and gives
      # you a dead app. Until this step existed, no line of Arch's Swift had ever
      # been executed.
      #
      # CI has no Supabase keys, so this is the design build on `MockData`: no
      # network, no sign-in, no notification prompt. That is the whole app's view
      # tree drawn from real code, which is the part worth knowing about.
      - name: Launch it on a simulator
        run: python3 tools/simrun.py build/Build/Products/Debug-iphonesimulator/Arch.app

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # Two frames of the app actually running, which is the only thing in this
      # repository that has ever shown what Arch looks like rather than asserting
      # something about it.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshots
          path: |
            launching.png
            settled.png
          if-no-files-found: ignore
