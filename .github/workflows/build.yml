# Compiling Arch.
#
# Sixteen thousand lines of Swift were written on a Windows machine with no Swift
# toolchain. This is the first thing that has ever told us whether any of it is
# true. It needs no Mac and no paid developer account: GitHub's macOS runner is
# free on public repositories, and building for the simulator requires no signing.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that need no Xcode run first and separately, so a Swift failure
  # never hides a schema failure or the other way round.
  checks:
    name: Cross-reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install sqlparse

      - name: Swift names resolve
        run: python tools/swiftcheck.py Arch

      - name: SQL cross-references
        run: python backend/lint.py

      # All four run from the repository root. `working-directory: matcher` was
      # here and would have looked for matcher/matcher/selftest.py -- caught by
      # running them the way CI would rather than the way they are usually run.
      - name: The matcher agrees with itself
        run: python matcher/selftest.py

      - name: The compatibility tables still match the Swift
        run: python matcher/sqlgen.py --digest
        # Prints the two fingerprints. Compare against the database with:
        #   select digest, source_digest from compatibility_digest;

  # Whether CI can reach App Store Connect at all, on a runner that costs a tenth
  # of a macOS one.
  #
  # Everything about signing and TestFlight depends on three secrets being right,
  # and each of them fails differently and unhelpfully twenty minutes into a macOS
  # build. Asking Apple directly, first, turns four possible mysteries into one
  # plain answer -- and it does it in about fifteen seconds.
  signing:
    name: App Store Connect reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install "pyjwt[crypto]"

      - name: Ask Apple whether these credentials work
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: python tools/ascheck.py

  build:
    name: Build for the simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The newest Xcode on the image, not a pinned one.
      #
      # Pinning 16.2 is what broke the first build: its SDK is iOS 18.2 and the
      # runner carries simulator runtimes for 18.5, 18.6 and 26.x, so the asset
      # catalog compiler could not find a runtime matching the SDK and failed
      # before a single line of Swift was read. Taking the newest keeps the SDK and
      # the runtimes on the image in step with each other, which is the property
      # that actually matters here.
      - name: Use the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -switch "$newest"
          xcodebuild -version

      # Printed so that the next runtime mismatch is one line to read rather than
      # a guess.
      - name: What this image actually has
        run: |
          ls -d /Applications/Xcode*.app
          xcrun simctl list runtimes || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # `-destination generic/platform=iOS Simulator` builds without booting a
      # simulator, which is faster and does not depend on which runtimes the
      # runner image happens to carry. The bundle it produces is installable on any
      # of them, which is what the launch step below needs.
      #
      # `-derivedDataPath` is here only so that the .app has a known address;
      # Xcode's default is a hashed directory under ~/Library.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Arch.xcodeproj \
            -scheme Arch \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # Warnings are gathered whether the build passed or failed.
      #
      # They are the only feedback this project has ever had, and a *successful*
      # build used to throw them away entirely -- the summary below is `if:
      # failure()`, so going green meant nobody knew whether there were two
      # warnings or two hundred. `SWIFT_TREAT_WARNINGS_AS_ERRORS` stays NO, and
      # this is the other half of that bargain: they do not stop the build, but
      # they do get counted and read.
      - name: The warnings, gathered
        if: always()
        run: python3 tools/buildwarnings.py build.log

      # The first build of this project will not pass, so the error list is the
      # deliverable until it does.
      #
      # Emitted as workflow annotations as well as into the summary, because
      # **annotations are readable on a public repository without signing in and
      # logs are not.** That is what lets the errors be read straight off the run
      # rather than downloaded, unzipped and pasted by hand.
      - name: The errors, gathered
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          errors=$(grep -c 'error:' build.log || echo 0)
          warnings=$(grep -c 'warning:' build.log || echo 0)
          echo "Total: $errors errors, $warnings warnings" >> "$GITHUB_STEP_SUMMARY"

          # One annotation per distinct error, capped so a cascade of a thousand
          # does not bury the first real one.
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

          # xcodebuild's own summary lines say what it could not do at all, which
          # is a different and often more useful thing than a compile error.
          grep -E "^(\*\*|The following build commands failed|Command .* failed)" build.log \
            | sort -u | head -10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      # Compiling is not running.
      #
      # Everything above this proves the types line up. A force-unwrapped nil, a
      # font that is not in the bundle, a precondition in a store's `init`, a hang
      # in `ArchSession.start()` -- every one of those compiles perfectly and gives
      # you a dead app. Until this step existed, no line of Arch's Swift had ever
      # been executed.
      #
      # CI has no Supabase keys, so this is the design build on `MockData`: no
      # network, no sign-in, no notification prompt. That is the whole app's view
      # tree drawn from real code, which is the part worth knowing about.
      - name: Launch it on a simulator
        run: python3 tools/simrun.py build/Build/Products/Debug-iphonesimulator/Arch.app

      # Launching is not using.
      #
      # The step above proves Arch starts and draws. A dead button, a crash on
      # opening a profile and a navigation route that pushes nothing all look
      # exactly like a healthy launch from outside -- and this project has shipped
      # the third of those, four times over, in routes that compiled and went
      # nowhere. `ArchUITests` taps the tab bar, opens somebody, and comes back.
      #
      # The device comes from `simrun.py --device`, the same logic that picks one
      # for the launch, rather than a hardcoded iPhone model the runner image may
      # stop carrying.
      - name: Tap through it
        run: |
          set -o pipefail
          udid=$(python3 tools/simrun.py --device)
          echo "Testing on $udid"
          xcodebuild test \
            -project Arch.xcodeproj \
            -scheme Arch \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$udid" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      # A test target that executes *zero* tests exits zero, and the step goes
      # green -- the same silent success as a check that tests nothing, which this
      # project has now shipped three times. So the count is read back and an
      # empty run is failed on purpose.
      - name: How many tests ran
        if: always()
        run: python3 tools/testreport.py test.log

      # Same reasoning as the build errors: annotations are readable on a public
      # repository without signing in, and logs are not.
      - name: What failed, and in which test
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          echo "## Test failures" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|failed \(|Failing tests:" test.log | sort -u | head -60 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          grep -E "error:|^Testing failed:|^\s+-\[Arch" test.log | sort -u | head -20 \
            | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore

      # Three frames -- the screen before Arch opened, one during its launch view,
      # and one well after. The only thing in this repository that has ever shown
      # what Arch looks like rather than asserting something about it.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-screenshots
          path: |
            before.png
            launching.png
            settled.png
          if-no-files-found: ignore

  # Arch, signed, on a phone.
  #
  # Only after everything above has passed, and only for main -- a pull request
  # has no business uploading a build to TestFlight.
  #
  # **Release is a different app from the one the tests just ran.** Debug is the
  # design build on MockData, which is what the UI tests need; Release carries the
  # Supabase URL and anon key and talks to the real project. So this is the first
  # time each commit's *real* configuration is built at all.
  testflight:
    name: TestFlight
    needs: [checks, signing, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install "pyjwt[crypto]"

      - name: Use the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -switch "$newest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The Team ID is read from Apple rather than kept as a fourth secret, so it
      # cannot drift from the account actually being signed against.
      - name: Work out the Team ID
        id: team
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          team=$(python tools/ascheck.py --team-id)
          echo "Team ID: $team"
          echo "team=$team" >> "$GITHUB_OUTPUT"

      # xcodebuild wants the key as a file. ~/private_keys is the directory it
      # looks in by default, and the name has to be AuthKey_<KEYID>.p8.
      - name: Put the API key where xcodebuild looks
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          echo "wrote $(wc -c < ~/private_keys/AuthKey_$APPSTORE_KEY_ID.p8) bytes"

      # A distribution certificate, made through the API because there is no Mac
      # to make one on and `-allowProvisioningUpdates` will only ever make a
      # development one. See tools/makecert.py for why it is created and thrown
      # away every run rather than kept.
      - name: Make a distribution certificate
        id: cert
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: python tools/makecert.py build/signing

      # Its own keychain, not the login one. The runner is thrown away afterwards,
      # but a build that quietly depends on the state of a shared keychain is the
      # kind that works until the image changes underneath it.
      - name: Import it into a keychain
        env:
          P12_PASS: ${{ steps.cert.outputs.pass }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/arch.keychain-db
          PASSWORD=$(python -c "import secrets;print(secrets.token_urlsafe(20))")
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import build/signing/dist.p12 -k "$KEYCHAIN" -P "$P12_PASS"             -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask for permission and the job hangs
          # until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "identities now available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Generate the project
        run: xcodegen generate

      # The run number as the build number. Apple refuses a build number it has
      # seen before for the same version, and a counter that never repeats is the
      # cheapest way never to think about it again.
      - name: Archive
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Arch.xcodeproj \
            -scheme Arch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Arch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APPSTORE_KEY_ID.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM=${{ steps.team.outputs.team }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee archive.log

      # Confirms the Release build really did get the keys, without printing the
      # key. A Release build that silently shipped as the design build would look
      # perfect right up until somebody tried to sign in.
      - name: Check the archive is the real build, not the design build
        run: |
          plist=build/Arch.xcarchive/Products/Applications/Arch.app/Info.plist
          url=$(/usr/libexec/PlistBuddy -c "Print :ARCH_SUPABASE_URL" "$plist" 2>/dev/null || echo "")
          key=$(/usr/libexec/PlistBuddy -c "Print :ARCH_SUPABASE_ANON_KEY" "$plist" 2>/dev/null || echo "")
          echo "ARCH_SUPABASE_URL = $url"
          echo "anon key is ${#key} characters"
          if [ -z "$url" ] || [ ${#key} -lt 40 ]; then
            echo "::error::The Release archive has no Supabase config -- it would run as the design build."
            exit 1
          fi
          printf '::notice title=Archive::Real build, pointed at %s\n' "$url"

      - name: Export and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ steps.team.outputs.team }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Arch.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APPSTORE_KEY_ID.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            | tee export.log

      - name: What went wrong
        if: failure()
        run: |
          for log in archive.log export.log; do
            [ -f "$log" ] || continue
            echo "## $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|error |Provisioning|No profiles|not available|failed" "$log" \
              | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|^Provisioning|No profiles|Code Signing Error" "$log" \
              | sort -u | head -15 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
